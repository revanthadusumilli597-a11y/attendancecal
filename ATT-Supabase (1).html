(function(){
  try{
    var users = JSON.parse(localStorage.getItem("erp_users")||"[]");

    var guest = users.find(function(u){return u.id==="guest";});
    if(!guest){
      guest = {id:"guest", name:"Student", roll:"", studentNumber:"", branch:"CSE", section:"", fatherName:"", fatherPhone:"", photo:"", email:"", password:""};
      users.push(guest);
      localStorage.setItem("erp_users", JSON.stringify(users));
    }
    if(!localStorage.getItem("erp_active_user")) localStorage.setItem("erp_active_user","guest");
    // Clear any stale auth gate flags
    localStorage.removeItem("erp_auth_required");
  }catch(e){}
})();
</script>

<script>

window.SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_U_GSOqVo27lUW4RvY1lbhg_72xPso9-';
(function(){
  try{
    var client = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_PUBLISHABLE_KEY, {auth:{persistSession:true, autoRefreshToken:true}});
    window.attendanceCalSupabase = client;
    window.attendanceCalReady = (async function(){
      try{
        var s = await client.auth.getSession();
        if(!s.data.session){ await client.auth.signInAnonymously(); }
        var u = (await client.auth.getUser()).data.user;
        window.attendanceCalUserId = u ? u.id : null;
        window.dispatchEvent(new CustomEvent('attendancecal:supabase-ready', {detail:{userId: window.attendanceCalUserId}}));
        return u;
      }catch(e){ console.warn('Supabase auth failed, app still works offline:', e); return null; }
    })();
    // ---- Sync bridge: localStorage (erp_*) <-> Supabase table public.app_data ----
    var SYNC_KEYS = ["erp_attendance","erp_period","erp_tasks","erp_fees","erp_marks","erp_audit","erp_chat","erp_holidays","erp_semesters","erp_timetable","erp_assignments","erp_exams","erp_study","erp_class_timetable_v13","erp_mid1","erp_mid2","erp_sem_tt","erp_acad_cal","erp_complaints","erp_leaves","erp_subjects","erp_profile","erp_target"];
    function accountPrefix(){
      var id = localStorage.getItem("erp_active_user") || "guest";
      return "erp_account_" + encodeURIComponent(id) + "_";
    }
    async function pushToSupabase(){
      if(!window.attendanceCalUserId) return;
      try{
        var prefix = accountPrefix();
        for (var i=0;i<SYNC_KEYS.length;i++){
          var k = SYNC_KEYS[i];
          var raw = localStorage.getItem(prefix + k);
          if(raw === null) continue;
          var payload = null; try{ payload = JSON.parse(raw); }catch(e){ payload = raw; }
          var r = await client.from("app_data").upsert({user_id: window.attendanceCalUserId, data_key: k, data: payload, updated_at: new Date().toISOString()}, {onConflict:"user_id,data_key"});
          if(r.error) { console.warn("Sync push failed", k, r.error.message); break; }
        }
        localStorage.setItem("erp_supabase_last_push", new Date().toISOString());
      }catch(e){ console.warn("Sync push error", e); }
    }
    async function pullFromSupabase(){
      if(!window.attendanceCalUserId) return false;
      try{
        var r = await client.from("app_data").select("data_key,data,updated_at").eq("user_id", window.attendanceCalUserId);
        if(r.error) throw r.error;
        if(!r.data || !r.data.length) return false;
        var prefix = accountPrefix(); var changed = false;
        r.data.forEach(function(row){
          if(SYNC_KEYS.indexOf(row.data_key) === -1) return;
          var key = prefix + row.data_key;
          var localRaw = localStorage.getItem(key);
          // Only pull if local is empty - local is source of truth on this device to avoid overwriting new data
          if(localRaw === null || localRaw === "[]"){
            localStorage.setItem(key, JSON.stringify(row.data)); changed = true;
          }
        });
        return changed;
      }catch(e){ console.warn("Sync pull error (run supabase-setup.sql first):", e.message); return false; }
    }
    window.attendanceCalSync = {push: pushToSupabase, pull: pullFromSupabase};
    window.addEventListener('attendancecal:supabase-ready', async function(){
      var changed = await pullFromSupabase();
      if(changed) location.reload();
      // Push on change (debounced) + every 60s + before unload
      var t=null;
      function schedule(){ clearTimeout(t); t=setTimeout(pushToSupabase, 1500); }
      window.addEventListener('storage', schedule);
      document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') pushToSupabase(); });
      window.addEventListener('beforeunload', function(){ try{ navigator.sendBeacon && null; }catch(e){} });
      setInterval(pushToSupabase, 60000);
      // Expose manual sync for debugging: window.attendanceCalSync.push()
    });
    // First push after app has loaded / seeded data (so empty cloud gets this device's data)
    window.addEventListener('load', function(){ setTimeout(function(){ if(window.attendanceCalUserId) pushToSupabase(); }, 4000); });
  }catch(e){ console.warn('Supabase init failed', e); }
})();
</script>

          changed = true;
        }
      });

      var subjectsKey = prefix + "erp_subjects";
      var subjects = JSON.parse(localStorage.getItem(subjectsKey) || "null");
      var demoSubjects = [
        ["daa", 20, 16], ["cn", 22, 15], ["devops", 18, 14], ["cg", 20, 12],
        ["da", 19, 17], ["devops_lab", 12, 11], ["cn_lab", 12, 10],
        ["ui_lab", 10, 9], ["ipr", 14, 13], ["aecs", 10, 10]
      ];
      if (Array.isArray(subjects) && subjects.length === demoSubjects.length &&
          demoSubjects.every(function (expected) {
            var subject = subjects.find(function (item) {
              return item.id === expected[0];
            });
            return subject && subject.total === expected[1] && subject.attended === expected[2];
          })) {
        localStorage.setItem(subjectsKey, "[]");
        changed = true;
      } else if (localStorage.getItem(subjectsKey) === null) {
        localStorage.setItem(subjectsKey, "[]");
        changed = true;
      }

      var profileKey = prefix + "erp_profile";
      var profile = JSON.parse(localStorage.getItem(profileKey) || "null");
      var isDemoProfile = profile && profile.fullName === "Karthik Reddy" &&
        profile.roll === "23CSE042" && profile.email === "karthik@aicse.academy";
      var identityMismatch = profile &&
        (profile.fullName !== (student.name || "") || profile.roll !== (student.roll || ""));
      if (!profile || isDemoProfile || identityMismatch) {
        profile = Object.assign({}, profile || {}, {
          fullName: student.name || "",
          studentNumber: student.studentNumber || "",
          roll: student.roll || "",
          college: isDemoProfile ? "" : (profile && profile.college || ""),
          branch: student.branch || "",
          section: student.section || "",
          year: isDemoProfile ? "" : (profile && profile.year || ""),
          sem: isDemoProfile ? "" : (profile && profile.sem || ""),
          parentName: student.fatherName || "",
          relation: student.fatherName ? "Father" : "",
          fatherPhone: student.fatherPhone || "",
          email: "",
          photo: student.photo || ""
        });
        localStorage.setItem(profileKey, JSON.stringify(profile));
        changed = true;
      }

      if (changed) location.reload();
    })();
  </script>
<script>
(function(){
  function kill(){ document.querySelectorAll('.attendance-auth-overlay').forEach(function(el){ el.remove(); }); }
  kill();
  var obs = new MutationObserver(kill);
  obs.observe(document.documentElement, {childList:true, subtree:true});
  setTimeout(function(){ obs.disconnect(); kill(); }, 8000);
})();
</script>
